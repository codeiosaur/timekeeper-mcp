[project]
name = "timekeeper-mcp"
version = "0.1.0"
description = "An MCP server providing authoritative current-time tools for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Alexander Nyczkowski" }
]
keywords = ["mcp", "model-context-protocol", "time", "timezone", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=1.30,<2",
    # Windows has no system IANA timezone database; zoneinfo falls back to
    # this first-party (PSF) data package. Other platforms use the OS copy.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/codeiosaur/timekeeper-mcp"
Issues = "https://github.com/codeiosaur/timekeeper-mcp/issues"

[project.scripts]
timekeeper-mcp = "timekeeper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "mcp_remote: opt-in compatibility check through the pinned mcp-remote proxy (needs npx and network)",
]
